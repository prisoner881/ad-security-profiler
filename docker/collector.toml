# collector_daemon.py configuration for the container. See docs/DAEMON.md for
# every setting and collector_daemon.example.toml for the annotated list.
#
# Paths are inside the container:
#   /config                          this directory (read-only)
#   /run/secrets/<name>              the files in ./secrets
#   /var/lib/fortifydata-collector   ./data/state
#   /var/log/fortifydata-collector   ./data/logs
#
# Check it with:  docker compose run --rm collector --check-config

[daemon]
state_dir = "/var/lib/fortifydata-collector"
log_dir = "/var/log/fortifydata-collector"
# log_retention_days = 30

[platform]
mode = "local"
# The activation key from the FortifyData portal, in ./secrets/fd_activation_key.
# Uncomment to push the results (local mode) -- required in "fortifydata" mode.
# activation_key_file = "/run/secrets/fd_activation_key"
# ca_bundle = "/config/proxy-ca.pem"     # behind a TLS-inspecting proxy

[database]
host = "postgres"
user = "adprofiler"
password_file = "/run/secrets/pg_password"

[run]
# excel = false      # true: also write the Excel workbook to ./data/state/reports

# --- local mode: the run configuration ---------------------------------------
# (In "fortifydata" mode these come from the portal and are ignored here.)

[schedule]
time = "02:30"
timezone = "UTC"                  # IANA name, e.g. America/Chicago

[ad]
dc_host = "dc01.corp.example.com"
username = "svc_adaudit@corp.example.com"
password_file = "/run/secrets/ad_bind_password"
# ssl = true                      # LDAPS on 636 (default)
# ca_cert_file = "/config/ldaps-ca.pem"   # put the CA certificate in ./config
# sysvol = true
domain_fqdn = "corp.example.com"

# Optional: uncomment to collect Entra ID too.
# [entra]
# tenant_id = "00000000-0000-0000-0000-000000000000"
# app_id = "00000000-0000-0000-0000-000000000000"
# client_secret_file = "/run/secrets/entra_app_secret"

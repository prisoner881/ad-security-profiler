# Builds, tests and publishes the collector image, fortifydata/collector-ad,
# for linux/amd64 and linux/arm64. See docs/MAINTAINERS.md ("Releasing").
#
#   pull request          tests, and both images built and smoke-tested; nothing pushed
#   push to development   also pushed as vX.Y.Z-dev.<run number> and develop
#   tag vX.Y.Z            also pushed as vX.Y.Z and latest; the tag must equal
#                         collector_daemon.py's VERSION
#
# X.Y.Z is collector_daemon.py's VERSION. The image reports the version it
# was built as (COLLECTOR_VERSION, without the "v") to the platform.
#
# Repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub
# access token with write access to fortifydata/collector-ad). In a
# repository without them (a fork, a personal copy) everything runs except
# the push, with a warning.

name: collector image

on:
  pull_request:
  push:
    branches: [development]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: collector-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: fortifydata/collector-ad

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-trixie
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: PostgreSQL 17 client tools (pg_dump, pg_restore)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Dependencies
        run: pip install --only-binary=":all:" -r requirements.txt

      - name: Tests
        env:
          ADPROFILER_TEST_PGHOST: 127.0.0.1
          ADPROFILER_TEST_PGPORT: "5432"
          ADPROFILER_TEST_PGUSER: postgres
          ADPROFILER_TEST_PGPASSWORD: ci-only-password
          ADPROFILER_TEST_PGBIN: /usr/lib/postgresql/17/bin
        run: python -m unittest discover -s tests -t . -v

      - name: Shell scripts
        run: bash -n docker/install.sh

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Version and tags
        id: v
        env:
          HAS_PUSH_SECRET: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          base="$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' collector_daemon.py)"
          if ! printf '%s' "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::collector_daemon.py VERSION '$base' is not X.Y.Z"
            exit 1
          fi
          push=false
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/tags/*)
              if [ "$GITHUB_REF_NAME" != "v$base" ]; then
                echo "::error::tag $GITHUB_REF_NAME does not match collector_daemon.py VERSION $base (expected v$base)"
                exit 1
              fi
              version="$base"
              tags="$IMAGE:v$version,$IMAGE:latest"
              push=true
              ;;
            push:refs/heads/*)
              version="$base-dev.$GITHUB_RUN_NUMBER"
              tags="$IMAGE:v$version,$IMAGE:develop"
              push=true
              ;;
            *)
              version="$base-pr.$GITHUB_RUN_NUMBER"
              tags="$IMAGE:v$version"
              ;;
          esac
          if [ "$push" = true ] && [ "$HAS_PUSH_SECRET" != true ]; then
            echo "::warning::no DOCKERHUB_TOKEN secret in this repository: built and tested, not pushed"
            push=false
          fi
          {
            echo "version=$version"
            echo "tags=$tags"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"
          echo "Image version $version; tags $tags; push $push" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      # Each platform is built and loaded on its own, then run: the daemon
      # must report the version it was built as, and the bundled libraries
      # and pg_dump must work on that architecture. The unit tests also run
      # inside the amd64 image. The final multi-platform build reuses these
      # builds' cache.
      - name: Build linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            COLLECTOR_VERSION=${{ steps.v.outputs.version }}
          tags: collector-ad-test:amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          load: true

      - name: Build linux/arm64 (emulated)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            COLLECTOR_VERSION=${{ steps.v.outputs.version }}
          tags: collector-ad-test:arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          load: true

      - name: Smoke-test both images
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            out="$(docker run --rm --platform "linux/$arch" "collector-ad-test:$arch" --version)"
            echo "$arch: $out"
            case "$out" in
              *"reports version $VERSION)"*) ;;
              *) echo "::error::the $arch image reports the wrong version: $out"; exit 1 ;;
            esac
            docker run --rm --platform "linux/$arch" --entrypoint sh "collector-ad-test:$arch" -c '
              set -e
              uname -m
              pg_dump --version
              pg_restore --version
              python -c "import psycopg2, ldap3, impacket, cryptography, Cryptodome, openpyxl, requests, zoneinfo; zoneinfo.ZoneInfo(\"America/Chicago\"); print(\"imports ok\")"'
          done
          docker run --rm --platform linux/amd64 --read-only --tmpfs /tmp \
            -v "$PWD/tests:/opt/collector/tests:ro" -w /opt/collector \
            --entrypoint python collector-ad-test:amd64 -m unittest discover -s tests -t . -v

      - uses: docker/login-action@v3
        if: steps.v.outputs.push == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the multi-platform image
        if: steps.v.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            COLLECTOR_VERSION=${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.v.outputs.tags }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          provenance: mode=max
          sbom: true
          push: true
